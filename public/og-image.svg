<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d23"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563ff"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9bdcff"/>
      <stop offset="100%" stop-color="#53a8ff"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#9fb3ff" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .eyebrow { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #b6c7ff; letter-spacing: 0.14em; }
      .title   { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 88px; font-weight: 800; fill: #f8fbff; }
      .accent  { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 88px; font-weight: 800; fill: url(#accentText); }
      .copy    { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 28px; font-weight: 500; fill: #c7d2fe; }
      .chip    { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #dbeafe; }
      .statNum { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #f8fbff; }
      .statLbl { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #b7c2e6; }
      .badge   { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(72 68)">
    <rect x="0" y="0" width="258" height="48" rx="24" fill="#101833" stroke="#3343a8" stroke-width="2"/>
    <circle cx="34" cy="24" r="6" fill="#6f7cff"/>
    <text x="54" y="31" class="badge">AI Mock Interview</text>
  </g>

  <g transform="translate(72 156)">
    <text x="0" y="0" class="eyebrow">ENGINEER INTERVIEW PLATFORM</text>
    <text x="0" y="120" class="title">Engineer</text>
    <text x="0" y="220" class="accent">Interview Hub</text>
    <text x="0" y="292" class="copy">180+ curated software engineering questions, AI scoring, and full mock interviews.</text>
  </g>

  <g transform="translate(72 484)">
    <rect x="0" y="0" width="130" height="44" rx="22" fill="#0f1733" stroke="#273257" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" class="chip">Frontend</text>

    <rect x="144" y="0" width="124" height="44" rx="22" fill="#0f1733" stroke="#273257" stroke-width="1.5"/>
    <text x="206" y="28" text-anchor="middle" class="chip">Backend</text>

    <rect x="282" y="0" width="160" height="44" rx="22" fill="#0f1733" stroke="#273257" stroke-width="1.5"/>
    <text x="362" y="28" text-anchor="middle" class="chip">Data Engineering</text>

    <rect x="456" y="0" width="106" height="44" rx="22" fill="#0f1733" stroke="#273257" stroke-width="1.5"/>
    <text x="509" y="28" text-anchor="middle" class="chip">DevOps</text>
  </g>

  <g transform="translate(72 562)">
    <text x="0" y="0" class="statNum">180+</text>
    <text x="0" y="28" class="statLbl">Top interview questions</text>

    <line x1="218" y1="-24" x2="218" y2="34" stroke="#273257" stroke-width="2"/>

    <text x="268" y="0" class="statNum">AI</text>
    <text x="268" y="28" class="statLbl">Instant scoring and coaching</text>
  </g>

  <g transform="translate(760 118)" filter="url(#softGlow)">
    <circle cx="180" cy="180" r="170" fill="#0d1430" fill-opacity="0.78"/>
    <circle cx="180" cy="180" r="172" fill="none" stroke="#21315f" stroke-width="2"/>

    <path
      d="M124 110 H286 C339 110 382 153 382 206 V296 C382 349 339 392 286 392 H212 L171 434 V392 H124 C71 392 28 349 28 296 V206 C28 153 71 110 124 110 Z"
      fill="none"
      stroke="url(#accent)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path d="M143 249 L108 214 L143 179" fill="none" stroke="#f8fbff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M226 172 L196 260" fill="none" stroke="#f8fbff" stroke-width="16" stroke-linecap="round"/>
    <path d="M266 179 L301 214 L266 249" fill="none" stroke="#f8fbff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M307 153 H344 L356 116 L374 175 L389 144 H423" fill="none" stroke="#d7f8ff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M390 79 L400 101 L422 111 L400 121 L390 143 L380 121 L358 111 L380 101 Z" fill="url(#accent)"/>
  </g>
</svg>
